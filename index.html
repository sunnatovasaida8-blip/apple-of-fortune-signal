<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple of Fortune - Signal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
        }

        .header-bar {
            width: 100%;
            max-width: 390px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .user-status-bar {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .top-badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            white-space: nowrap;
        }

        .container {
            width: 100%;
            max-width: 390px;
            text-align: center;
            margin: auto 0;
        }

        #welcome-screen, #id-screen {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 25px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #ffcc00;
            text-shadow: 0 2px 10px rgba(255,204,0,0.3);
        }

        .liquid-btn {
            background: linear-gradient(135deg, rgba(241, 39, 17, 0.9) 0%, rgba(245, 175, 25, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(245, 175, 25, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
            animation: liquid-pulse 2s infinite ease-in-out;
            margin-top: 10px;
        }

        @keyframes liquid-pulse {
            0% { transform: scale(1); box-shadow: 0 8px 25px rgba(245, 175, 25, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6); }
            50% { transform: scale(1.02); box-shadow: 0 12px 30px rgba(245, 175, 25, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.9); }
            100% { transform: scale(1); box-shadow: 0 8px 25px rgba(245, 175, 25, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6); }
        }

        .liquid-btn:active {
            transform: scale(0.95) !important;
            animation: none;
        }

        .hidden {
            display: none !important;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        /* O'yin ekrani - Faqat 1 ta faol qator ko'rsatiladi */
        #game-screen {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 20px 15px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 20px;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        /* Yagona faol qator dizayni */
        .single-row-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .coeff-badge {
            background: #1e4620;
            color: #4cd137;
            font-size: 18px;
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 12px;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            letter-spacing: 1px;
        }

        .cells-container {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .cell {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #a0522d 0%, #654321 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.2), 0 5px 15px rgba(0,0,0,0.4);
        }

        .cell.apple {
            background: radial-gradient(circle, #ff4757 0%, #c23616 100%);
            border-color: #ff6b81;
            box-shadow: 0 0 15px #ff4757, inset 0 3px 6px rgba(255,255,255,0.4);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }

        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        .full-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(0, 176, 155, 0.9), rgba(150, 201, 61, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 800;
            padding: 14px;
            box-shadow: 0 5px 20px rgba(0, 176, 155, 0.4), inset 0 1px 2px rgba(255,255,255,0.5);
            animation: liquid-pulse 2s infinite ease-in-out;
        }

        .footer-brand {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="user-status-bar" id="status-bar" style="display: none;">
            <div class="online-dot"></div>
            <span id="display-id">ID: -------</span>
        </div>
        <div class="top-badge" id="badge-title" style="margin-left: auto;">
            ✨ THEEAGLEE
        </div>
    </div>

    <div class="container">
        <!-- 1-Oyna: Asosiy ekran -->
        <div id="welcome-screen">
            <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" alt="Apple" class="logo-img">
            <h1>APPLE OF FORTUNE</h1>
            <button class="liquid-btn" onclick="openIdScreen()">SIGNAL OLISH</button>
        </div>

        <!-- 2-Oyna: ID kiritish oynasi -->
        <div id="id-screen" class="hidden">
            <h2 style="font-size: 16px; margin-bottom: 8px; color: #fff;">Melbet yoki Linebet ID yozing</h2>
            <p style="font-size: 11px; color: #aaa; margin-bottom: 15px;">ID 10 xonali sondan iborat bo'lishi kerak</p>
            <input type="number" id="user-id" class="input-box" placeholder="ID raqamini kiriting...">
            <button class="liquid-btn" onclick="startSignalGame()">BOSHLASH</button>
        </div>

        <!-- 3-Oyna: Faqat bitta qator ko'rinadigan o'yin ekrani -->
        <div id="game-screen" class="hidden">
            <div class="game-header">APPLE OF FORTUNE - SIGNAL</div>
            
            <div class="single-row-display" id="active-row-container">
                <!-- Dinamik ravishda bitta qator va 5 ta katakcha chiqadi -->
            </div>

            <div class="controls-grid">
                <button class="control-btn" onclick="prevRow()">⬅️ Oldingi qator</button>
                <button class="control-btn" onclick="nextRow()">Keyingi qator ➡️</button>
                <button class="control-btn full-btn" onclick="getNewSignal()">🎲 START SIGNAL OLISH</button>
            </div>
        </div>
    </div>

    <div class="footer-brand">
        POWERED BY THEEAGLEE
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const coefficients = [
            "x 1.23", "x 1.54", "x 1.93", "x 2.41", 
            "x 4.02", "x 6.71", "x 11.18", "x 27.97"
        ];

        let currentRowIndex = 0; 
        let signalData = []; 

        function openIdScreen() {
            document.getElementById("welcome-screen").classList.add("hidden");
            document.getElementById("id-screen").classList.remove("hidden");
        }

        function startSignalGame() {
            const userId = document.getElementById("user-id").value.trim();
            if (userId.length < 5) {
                alert("Iltimos, to'g'ri ID raqamini kiriting!");
                return;
            }

            document.getElementById("display-id").innerText = "ID: " + userId;
            document.getElementById("status-bar").style.display = "flex";

            document.getElementById("id-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");

            generateNewSignals();
        }

        function generateNewSignals() {
            signalData = [];
            for (let i = 0; i < coefficients.length; i++) {
                let applePos = Math.floor(Math.random() * 5);
                signalData.push(applePos);
            }
            currentRowIndex = 0; 
            updateView();
        }

        function getNewSignal() {
            generateNewSignals();
        }

        function nextRow() {
            if (currentRowIndex < coefficients.length - 1) {
                currentRowIndex++;
                updateView();
            }
        }

        function prevRow() {
            if (currentRowIndex > 0) {
                currentRowIndex--;
                updateView();
            }
        }

        function updateView() {
            const container = document.getElementById("active-row-container");
            container.innerHTML = "";

            // Faqat hozirgi qator koeffitsienti va uning 5 ta katakchasi yaratiladi
            let rowDiv = document.createElement("div");
            rowDiv.style.display = "flex";
            rowDiv.style.flexDirection = "column";
            rowDiv.style.alignItems = "center";
            rowDiv.style.gap = "15px";
            rowDiv.style.width = "100%";

            let coeffBadge = document.createElement("div");
            coeffBadge.className = "coeff-badge";
            coeffBadge.innerText = coefficients[currentRowIndex];
            rowDiv.appendChild(coeffBadge);

            let cellsDiv = document.createElement("div");
            cellsDiv.className = "cells-container";

            for (let j = 0; j < 5; j++) {
                let cell = document.createElement("div");
                cell.className = "cell";
                
                // Faqat bitta to'g'ri katakchaga olma (🍎) chiqadi, qolganlariga 🟤
                if (j === signalData[currentRowIndex]) {
                    cell.classList.add("apple");
                    cell.innerText = "🍎";
                } else {
                    cell.innerText = "🟤";
                }
                
                cellsDiv.appendChild(cell);
            }

            rowDiv.appendChild(cellsDiv);
            container.appendChild(rowDiv);
        }
    </script>
</body>
</html>
