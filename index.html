<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Apple of Fortune - Signal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            overflow-x: hidden;
        }

        .top-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Tepa chap burchakdagi ID va Online status */
        .user-status-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .container {
            width: 100%;
            max-width: 390px;
            text-align: center;
            margin: auto 0;
            position: relative;
        }

        #welcome-screen {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .logo-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 25px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #ffcc00;
            text-shadow: 0 2px 10px rgba(255,204,0,0.3);
        }

        /* iPhone Liquid Glass Bilqillaydigan Tugma */
        .liquid-btn {
            background: linear-gradient(135deg, rgba(241, 39, 17, 0.9) 0%, rgba(245, 175, 25, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(245, 175, 25, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
            animation: liquid-pulse 2s infinite ease-in-out;
            margin-top: 10px;
        }

        @keyframes liquid-pulse {
            0% { transform: scale(1); box-shadow: 0 8px 25px rgba(245, 175, 25, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6); }
            50% { transform: scale(1.03); box-shadow: 0 12px 30px rgba(245, 175, 25, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.9); }
            100% { transform: scale(1); box-shadow: 0 8px 25px rgba(245, 175, 25, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.6); }
        }

        .liquid-btn:active {
            transform: scale(0.95) !important;
            animation: none;
        }

        .hidden {
            display: none !important;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        #game-screen {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 10px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .game-header {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #00ffcc;
            letter-spacing: 0.5px;
        }

        .rows-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 8px;
        }

        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .coeff {
            background: #1e4620;
            color: #4cd137;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 5px;
            border-radius: 6px;
            min-width: 48px;
            text-align: center;
            border: 1px solid #2ecc71;
        }

        .cells-container {
            display: flex;
            gap: 4px;
        }

        .cell {
            width: 38px;
            height: 35px;
            background: linear-gradient(135deg, #a0522d 0%, #654321 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
        }

        .cell.apple {
            background: radial-gradient(circle, #ff4757 0%, #c23616 100%);
            border-color: #ff6b81;
            box-shadow: 0 0 8px #ff4757;
        }

        .cell.opened {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255,255,255,0.1);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            opacity: 0.5;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }

        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        .full-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(0, 176, 155, 0.9), rgba(150, 201, 61, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 800;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4), inset 0 1px 2px rgba(255,255,255,0.5);
            animation: liquid-pulse 2s infinite ease-in-out;
        }

        .footer-brand {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="top-badge">
        ✨ BOT CREATED BY THEEAGLEE
    </div>

    <!-- Tepa chap burchakda ID va Online status -->
    <div class="user-status-bar" id="status-bar" style="display: none;">
        <div class="online-dot"></div>
        <span id="display-id">ID: -------</span>
    </div>

    <div class="container">
        <!-- 1-Oyna: Asosiy ekran -->
        <div id="welcome-screen">
            <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" alt="Apple" class="logo-img">
            <h1>APPLE OF FORTUNE</h1>
            <button class="liquid-btn" onclick="openIdScreen()">SIGNAL OLISH</button>
        </div>

        <!-- ID kiritish oynasi -->
        <div id="id-screen" class="hidden" style="background: rgba(255, 255, 255, 0.08); padding: 25px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2);">
            <h2 style="font-size: 16px; margin-bottom: 8px; color: #fff;">Melbet yoki Linebet ID yozing</h2>
            <p style="font-size: 11px; color: #aaa; margin-bottom: 12px;">ID 10 xonali sondan iborat bo'lishi kerak</p>
            <input type="number" id="user-id" class="input-box" placeholder="ID raqamini kiriting...">
            <button class="liquid-btn" onclick="startSignalGame()">BOSHLASH</button>
        </div>

        <!-- O'yin va Signal maydoni -->
        <div id="game-screen" class="hidden">
            <div class="game-header">APPLE OF FORTUNE - SIGNAL</div>
            <div class="rows-wrapper" id="rows-container"></div>
            <div class="controls-grid">
                <button class="control-btn" onclick="prevRow()">⬅️ Oldingi qator</button>
                <button class="control-btn" onclick="nextRow()">Keyingi qator ➡️</button>
                <button class="control-btn full-btn" onclick="getNewSignal()">🎲 START SIGNAL OLISH</button>
            </div>
        </div>
    </div>

    <div class="footer-brand">
        POWERED BY THEEAGLEE
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const coefficients = [
            "x 1.23", "x 1.54", "x 1.93", "x 2.41", "x 4.02", 
            "x 6.71", "x 11.18", "x 16.50", "x 27.97", "x 45.00"
        ];

        let currentRowIndex = -1; 
        let signalData = []; 

        function openIdScreen() {
            document.getElementById("welcome-screen").classList.add("hidden");
            document.getElementById("id-screen").classList.remove("hidden");
        }

        function startSignalGame() {
            const userId = document.getElementById("user-id").value.trim();
            if (userId.length < 8) {
                alert("Iltimos, to'g'ri ID raqamini kiriting!");
                return;
            }

            // ID va Online statusni ko'rsatish
            document.getElementById("display-id").innerText = "ID: " + userId;
            document.getElementById("status-bar").style.display = "flex";

            document.getElementById("id-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");

            buildBoard();
            generateNewSignals();
        }

        function buildBoard() {
            const container = document.getElementById("rows-container");
            container.innerHTML = "";

            for (let i = 0; i < coefficients.length; i++) {
                let rowItem = document.createElement("div");
                rowItem.className = "row-item";
                rowItem.id = `row-${i}`;

                let coeffDiv = document.createElement("div");
                coeffDiv.className = "coeff";
                coeffDiv.innerText = coefficients[i];
                rowItem.appendChild(coeffDiv);

                let cellsDiv = document.createElement("div");
                cellsDiv.className = "cells-container";

                for (let j = 0; j < 5; j++) {
                    let cell = document.createElement("div");
                    cell.className = "cell";
                    cell.id = `cell-${i}-${j}`;
                    cell.innerText = "🟤"; 
                    cellsDiv.appendChild(cell);
                }

                rowItem.appendChild(cellsDiv);
                container.appendChild(rowItem);
            }
        }

        function generateNewSignals() {
            signalData = [];
            for (let i = 0; i < coefficients.length; i++) {
                let applePos = Math.floor(Math.random() * 5);
                signalData.push(applePos);
            }
            currentRowIndex = 0; 
            updateView();
        }

        function getNewSignal() {
            generateNewSignals();
        }

        function nextRow() {
            if (currentRowIndex < coefficients.length - 1) {
                currentRowIndex++;
                updateView();
            }
        }

        function prevRow() {
            if (currentRowIndex > 0) {
                currentRowIndex--;
                updateView();
            }
        }

        function updateView() {
            for (let i = 0; i < coefficients.length; i++) {
                for (let j = 0; j < 5; j++) {
                    let cell = document.getElementById(`cell-${i}-${j}`);
                    
                    if (i < currentRowIndex) {
                        cell.className = "cell opened";
                        cell.innerText = (j === signalData[i]) ? "🍎" : "🟤";
                    } else if (i === currentRowIndex) {
                        cell.className = "cell apple";
                        cell.innerText = (j === signalData[i]) ? "🍎" : "🟤";
                    } else {
                        cell.className = "cell";
                        cell.innerText = "🟤";
                    }
                }
            }
        }
    </script>
</body>
</html>
